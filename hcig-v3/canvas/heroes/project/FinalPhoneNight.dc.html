<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HCIG home, final, phone, night</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div style="width:390px;min-height:2290px;background:#000000;font-family:'Inter',system-ui,sans-serif;color:#FFFFFF">
<dc-import name="HeroBFilm" theme="{{theme}}" on-theme="{{setTheme}}" hint-size="390px,1050px"></dc-import>
<dc-import name="GroupFilm" theme="{{theme}}" hint-size="390px,1240px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Page"},"$preview":{"width":390,"height":2290}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    return {
      theme: s.theme || this.props.theme || 'dark',
      setTheme: this.setThemeFn || (this.setThemeFn = (t) => this.setState({ theme: t })),
    };
  }
}
</script>
</body>
</html>
