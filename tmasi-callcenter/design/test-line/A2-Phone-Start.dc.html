<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Test line phone, before the call</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#00797B}a:hover{color:#0F205C}
.core{animation:breathe 4.5s ease-in-out infinite}
.halo{animation:halo 4.5s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes halo{0%,100%{transform:scale(1);opacity:.25}50%{transform:scale(1.12);opacity:.1}}
@media (prefers-reduced-motion: reduce){.core,.halo{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F7F8; font-family: Poppins, system-ui, sans-serif; color: #0B1220; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 16px 18px 0">
    <div style="font-weight: 600; font-size: 15px">TMASI Test Line</div>
    <div style="font-size: 11px; color: #5B6474">Private, this laptop</div>
  </header>

  <div role="alert" style="margin: 14px 16px 0; padding: 12px 14px; border-radius: 14px; background: #FDECEA; color: #8A1C12; font-size: 13px; line-height: 1.45; display: flex; gap: 10px; align-items: flex-start">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B42318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>
    <span>Microphone is blocked. Click the lock icon in the address bar, allow the microphone, then try again.</span>
  </div>

  <section aria-label="Start a call" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 0 20px">
    <div style="position: relative; width: 140px; height: 140px">
      <span class="halo" aria-hidden="true" style="position: absolute; inset: -16px; border-radius: 50%; background: #009A9C"></span>
      <div class="core" style="position: absolute; inset: 0; border-radius: 50%; background: #009A9C; display: flex; align-items: center; justify-content: center">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10v1a7 7 0 0 0 14 0v-1"></path><path d="M12 18v4"></path></svg>
      </div>
    </div>
    <div style="text-align: center">
      <h1 style="margin: 0 0 6px; font-size: 24px; font-weight: 600">Talk to the TMASI assistant</h1>
      <p style="margin: 0; font-size: 13px; color: #5B6474">Switch language any time during the call.</p>
    </div>
    <label style="width: 100%; display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #5B6474">Starting language
      <select style="height: 50px; border-radius: 14px; border: 1px solid #DCE3E6; padding: 0 14px; font-family: inherit; font-size: 15px; color: #0B1220; background: #FFFFFF">
        <option>English</option><option>Deutsch</option><option>Русский</option><option>Polski</option><option>العربية مصر</option><option>العربية الخليج</option><option>Español</option><option>Italiano</option><option>Français</option><option>Čeština</option>
      </select>
    </label>
    <div role="group" aria-label="Voice" style="width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button type="button" aria-pressed="true" style="height: 50px; border-radius: 14px; border: 2px solid #009A9C; background: #E3F4F4; font-family: inherit; font-size: 14px; font-weight: 600; color: #00585B">Woman · Emma</button>
      <button type="button" aria-pressed="false" style="height: 50px; border-radius: 14px; border: 1px solid #DCE3E6; background: #FFFFFF; font-family: inherit; font-size: 14px; color: #344054">Man · James</button>
    </div>
  </section>

  <div style="padding: 0 20px 26px">
    <button type="button" style="width: 100%; height: 58px; border-radius: 999px; border: 0; background: #009A9C; color: #FFFFFF; font-family: inherit; font-weight: 600; font-size: 16px">Start call</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
