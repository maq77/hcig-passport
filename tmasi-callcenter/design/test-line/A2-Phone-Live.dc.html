<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Test line phone, during the call</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;family=Noto+Sans+Arabic:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#00797B}a:hover{color:#0F205C}
.ring{position:absolute;inset:0;border-radius:50%;border:2px solid #009A9C}
.r1{animation:out 2.4s ease-out infinite}
.r2{animation:out 2.4s ease-out .8s infinite}
.r3{animation:out 2.4s ease-out 1.6s infinite}
.core{animation:breathe 4s ease-in-out infinite}
@keyframes out{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.6);opacity:0}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.chipnew{animation:pop .5s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.ring,.core,.chipnew{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F7F8; font-family: Poppins, system-ui, sans-serif; color: #0B1220; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 6px">
    <span style="font-weight: 600; font-size: 15px">TMASI Test Line</span>
    <div style="display: flex; gap: 6px">
      <span style="padding: 5px 10px; border-radius: 999px; background: #E3F4F4; color: #00666A; font-size: 12px; font-weight: 600">01:42</span>
      <span style="padding: 5px 10px; border-radius: 999px; background: #FFFFFF; border: 1px solid #DCE3E6; font-size: 12px; color: #344054">0.7 s</span>
    </div>
  </header>

  <section aria-label="Call" style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 8px 18px 0">
    <div style="position: relative; width: 150px; height: 150px; margin: 18px 0 10px">
      <span class="ring r1" aria-hidden="true"></span>
      <span class="ring r2" aria-hidden="true"></span>
      <span class="ring r3" aria-hidden="true"></span>
      <div class="core" style="position: absolute; inset: 18px; border-radius: 50%; background: #009A9C; display: flex; align-items: center; justify-content: center; color: #FFFFFF; text-align: center">
        <div><div style="font-size: 20px; font-weight: 600">Emma</div><div style="font-size: 10px; opacity: .85">speaking</div></div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 6px">
      <span style="padding: 5px 10px; border-radius: 10px; background: #FFFFFF; border: 1px solid #E4EAED; font-size: 12px">English</span>
      <span aria-hidden="true" style="width: 16px; height: 2px; background: #BFE3E3"></span>
      <span class="chipnew" style="padding: 5px 10px; border-radius: 10px; background: #009A9C; color: #FFFFFF; font-size: 12px; font-weight: 600">العربية</span>
      <span style="font-size: 11px; color: #00666A; font-weight: 600">same voice</span>
    </div>
    <p dir="rtl" style="margin: 4px 0 0; text-align: center; font-family: 'Noto Sans Arabic', Poppins, sans-serif; font-size: 19px; line-height: 1.6; font-weight: 500">تمام يا سارة، فريقنا في الغردقة يقدر يرتّب لك check-up كامل.</p>
  </section>

  <div style="flex: 1; margin: 14px 12px 0; background: #FFFFFF; border-radius: 22px 22px 0 0; border: 1px solid #E4EAED; border-bottom: 0; padding: 10px 16px 16px; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
    <div aria-hidden="true" style="width: 40px; height: 4px; border-radius: 4px; background: #D0D8DC; margin: 0 auto 4px"></div>
    <div role="tablist" aria-label="Live panels" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 3px; border-radius: 12px; background: #EEF2F4">
      <button type="button" role="tab" aria-selected="true" style="height: 36px; border: 0; border-radius: 9px; background: #FFFFFF; font-family: inherit; font-size: 12px; font-weight: 600; color: #0B1220">Case</button>
      <button type="button" role="tab" aria-selected="false" style="height: 36px; border: 0; border-radius: 9px; background: transparent; font-family: inherit; font-size: 12px; color: #5B6474">Transcript</button>
      <button type="button" role="tab" aria-selected="false" style="height: 36px; border: 0; border-radius: 9px; background: transparent; font-family: inherit; font-size: 12px; color: #5B6474">Checks</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; font-size: 13px">
      <div style="display: flex; justify-content: space-between"><span style="color: #5B6474">Name</span><span style="font-weight: 500">Sara</span></div>
      <div style="display: flex; justify-content: space-between"><span style="color: #5B6474">Country</span><span style="font-weight: 500">Germany</span></div>
      <div style="display: flex; justify-content: space-between"><span style="color: #5B6474">Need</span><span style="font-weight: 500">Check-up in Hurghada</span></div>
      <div style="display: flex; justify-content: space-between"><span style="color: #5B6474">Dates</span><span style="font-weight: 500">Next month</span></div>
      <div style="display: flex; justify-content: space-between"><span style="color: #5B6474">Contact</span><span style="color: #98A2B3">waiting</span></div>
    </div>
    <div style="margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 10px">
      <button type="button" style="height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #DCE3E6; background: #FFFFFF; font-family: inherit; font-size: 13px; color: #344054">Man · James</button>
      <button type="button" aria-label="Mute microphone" style="width: 48px; height: 48px; border-radius: 50%; border: 1px solid #DCE3E6; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#344054" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10v1a7 7 0 0 0 14 0v-1"></path><path d="M12 18v4"></path></svg>
      </button>
      <button type="button" style="height: 52px; padding: 0 24px; border-radius: 999px; border: 0; background: #B42318; color: #FFFFFF; font-family: inherit; font-weight: 600; font-size: 14px">End call</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
